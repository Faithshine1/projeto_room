<div style="display: flex; gap: 20px; padding: 20px; font-family: sans-serif;">
  
  <!-- PAINEL LATERAL: FORMULÁRIO -->
  <div style="width: 280px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #f9f9f9;">
    <h3>Faça seu Novo Agendamento</h3>
    
    <form (ngSubmit)="handleSubmit()" style="display: flex; flex-direction: column; gap: 15px;">
      <div>
        <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px;">
          Selecione a Sala
        </label>
        <select 
          [(ngModel)]="form.sala" 
          name="sala" 
          style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"
        >
          <option value="Laboratório de Ciências">Laboratório de Ciências</option>
          <option value="Sala 201">Sala 201</option>
          <option value="Sala 200">Sala 200</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px;">
          Selecione a Data
        </label>
        <input 
          type="date" 
          [(ngModel)]="form.data" 
          name="data" 
          style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"
        />
      </div>

      <div>
        <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px;">
          Selecione a Hora
        </label>
        <select 
          [(ngModel)]="form.hora" 
          name="hora" 
          style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"
        >
          <option *ngFor="let h of horarios" [value]="h">{{ h }}</option>
        </select>
      </div>

      <button 
        type="submit" 
        style="background-color: #2b2d84; color: #fff; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;"
      >
        Agendar
      </button>
    </form>
  </div>

  <!-- PAINEL PRINCIPAL: AGENDA SEMANAL -->
  <div style="flex: 1;">
    <h2 style="text-align: center; color: #2b2d84;">AGENDA SEMANAL</h2>

    <table style="width: 100%; border-collapse: separate; border-spacing: 8px;">
      <thead>
        <tr>
          <th style="background-color: #2b2d84; color: #fff; padding: 10px; border-radius: 4px;">Horário</th>
          <th *ngFor="let dia of diasSemana" style="background-color: #2b2d84; color: #fff; padding: 10px; border-radius: 4px;">
            {{ dia }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let hora of horarios">
          <td style="text-align: center; background-color: #f0f0f0; font-weight: bold; padding: 10px; border-radius: 4px;">
            {{ hora }}
          </td>
          <td *ngFor="let dia of diasSemana" style="width: 18%; text-align: center; height: 60px;">
            <ng-container *ngIf="getAgendamentoSlot(dia, hora) as item; else slotVazio">
              <div style="background-color: #2b2d84; color: #fff; padding: 8px; border-radius: 4px; height: 100%;">
                <div style="font-weight: bold; font-size: 13px;">{{ item.sala }}</div>
                <div style="font-size: 11px;">{{ item.materia }}</div>
              </div>
            </ng-container>
            <ng-template #slotVazio>
              <div style="background-color: #f9f9f9; border: 1px solid #f0f0f0; height: 100%; border-radius: 4px;"></div>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
