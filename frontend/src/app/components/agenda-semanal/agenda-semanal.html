<div class="agenda-container">

  <!-- PAINEL LATERAL: FORMULÁRIO -->

  <div class="form-panel">

    <h3>Novo agendamento</h3>

    <form
      (ngSubmit)="handleSubmit()"
      class="agendamento-form"
    >

      <!-- SALA -->

      <div class="form-group">

        <label class="form-label" for="sala">
          Sala
        </label>

        <select
          id="sala"
          [(ngModel)]="form.sala"
          name="sala"
          class="form-input"
        >
          <option value="Laboratório de Ciências">
            Laboratório de Ciências
          </option>

          <option value="Sala 201">
            Sala 201
          </option>

          <option value="Sala 200">
            Sala 200
          </option>
        </select>

      </div>


      <!-- DATA -->

      <div class="form-group">

        <label class="form-label" for="data">
          Data
        </label>

        <input
          id="data"
          type="date"
          [min]="dataMinima"
          [(ngModel)]="form.data"
          name="data"
          class="form-input"
        />

      </div>


      <!-- HORA -->

      <div class="form-group">

        <label class="form-label" for="hora">
          Hora
        </label>

        <select
          id="hora"
          [(ngModel)]="form.hora"
          name="hora"
          class="form-input"
        >

          <option
            *ngFor="let h of horarios"
            [value]="h"
          >
            {{ h }}
          </option>

        </select>

      </div>


      <!-- BOTÃO AGENDAR -->

      <button
        type="submit"
        class="btn-agendar"
      >
        <i class="fa-solid fa-calendar-plus"></i>
        Agendar
      </button>

    </form>

  </div>


  <!-- PAINEL PRINCIPAL: AGENDA SEMANAL -->

  <div class="agenda-panel">

    <h2 class="agenda-title">
      Agenda semanal
    </h2>

    <div class="table-scroll">

      <table class="agenda-table">

        <thead>

          <tr>

            <th>
              Horário
            </th>

            <th
              *ngFor="let dia of diasSemana"
              [class.hoje]="dia === diaHoje"
            >
              {{ dia }}

              <span
                class="tag-hoje"
                *ngIf="dia === diaHoje"
              >
                Hoje
              </span>
            </th>

          </tr>

        </thead>


        <tbody>

          <tr
            *ngFor="let hora of horarios"
          >

            <td class="horario">
              {{ hora }}
            </td>


            <td
              *ngFor="let dia of diasSemana"
              class="agenda-slot"
              [class.hoje]="dia === diaHoje"
            >

              <ng-container
                *ngIf="
                  getAgendamentoSlot(dia, hora) as item;
                  else slotVazio
                "
              >

                <div class="agendamento">

                  <div class="agendamento-sala">
                    {{ item.sala }}
                  </div>

                  <div class="agendamento-materia">
                    {{ item.materia }}
                  </div>

                </div>

              </ng-container>


              <ng-template #slotVazio>

                <div class="slot-vazio"></div>

              </ng-template>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- ========================================= -->
<!-- MODAL DE CONFIRMAÇÃO -->
<!-- ========================================= -->

<div
  *ngIf="mostrarConfirmacao"
  class="modal-overlay"
  (click)="cancelarConfirmacao()"
>

  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >

    <div class="modal-icon">
      <i class="fa-solid fa-calendar-check"></i>
    </div>

    <h2 class="modal-title">
      Confirmar agendamento
    </h2>

    <p class="modal-description">
      Confira os dados antes de confirmar.
    </p>


    <div class="confirmacao-grid">

      <!-- SALA -->

      <div class="confirmacao-item confirmacao-sala">

        <strong>Sala</strong>

        <div class="confirmacao-valor">
          {{ form.sala }}
        </div>

      </div>


      <!-- DATA -->

      <div class="confirmacao-item">

        <strong>Data</strong>

        <div class="confirmacao-valor">
          {{ formatarData(form.data) }}
        </div>

      </div>


      <!-- DIA -->

      <div class="confirmacao-item">

        <strong>Dia</strong>

        <div class="confirmacao-valor">
          {{ diaConfirmacao }}
        </div>

      </div>


      <!-- HORÁRIO -->

      <div class="confirmacao-item">

        <strong>Horário</strong>

        <div class="confirmacao-valor">
          {{ form.hora }}
        </div>

      </div>

    </div>


    <!-- BOTÕES -->

    <div class="modal-buttons">

      <button
        type="button"
        (click)="cancelarConfirmacao()"
        class="btn-cancelar"
      >
        Cancelar
      </button>

      <button
        type="button"
        (click)="confirmarAgendamento()"
        class="btn-confirmar"
      >
        Confirmar
      </button>

    </div>

  </div>

</div>


<!-- ========================================= -->
<!-- AVISO (substitui o alert) -->
<!-- ========================================= -->

<div
  *ngIf="aviso"
  class="toast"
  [class.toast-erro]="aviso.tipo === 'erro'"
  role="status"
>

  <i
    class="fa-solid"
    [ngClass]="
      aviso.tipo === 'erro'
        ? 'fa-circle-exclamation'
        : 'fa-circle-check'
    "
  ></i>

  <span>{{ aviso.texto }}</span>

</div>
