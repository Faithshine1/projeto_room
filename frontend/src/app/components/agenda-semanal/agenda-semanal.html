<div class="agenda-container">

  <!-- PAINEL LATERAL: FORMULÁRIO -->

  <div class="form-panel">

    <h3>Faça seu Novo Agendamento</h3>

    <form
      (ngSubmit)="handleSubmit()"
      class="agendamento-form"
    >

      <!-- SALA -->

      <div>

        <label class="form-label">
          Selecione a Sala
        </label>

        <select
          [(ngModel)]="form.sala"
          name="sala"
          class="form-input"
        >
          <option value="Laboratório de Ciências">
            Laboratório de Ciências
          </option>

          <option value="Sala 201">
            Sala 201
          </option>

          <option value="Sala 200">
            Sala 200
          </option>
        </select>

      </div>


      <!-- DATA -->

      <div>

        <label class="form-label">
          Selecione a Data
        </label>

        <input
          type="date"
          [(ngModel)]="form.data"
          name="data"
          class="form-input"
        />

      </div>


      <!-- HORA -->

      <div>

        <label class="form-label">
          Selecione a Hora
        </label>

        <select
          [(ngModel)]="form.hora"
          name="hora"
          class="form-input"
        >

          <option
            *ngFor="let h of horarios"
            [value]="h"
          >
            {{ h }}
          </option>

        </select>

      </div>


      <!-- BOTÃO AGENDAR -->

      <button
        type="submit"
        class="btn-agendar"
      >
        Agendar
      </button>

    </form>

  </div>


  <!-- PAINEL PRINCIPAL: AGENDA SEMANAL -->

  <div class="agenda-panel">

    <h2 class="agenda-title">
      AGENDA SEMANAL
    </h2>

    <table class="agenda-table">

      <thead>

        <tr>

          <th>
            Horário
          </th>

          <th
            *ngFor="let dia of diasSemana"
          >
            {{ dia }}
          </th>

        </tr>

      </thead>


      <tbody>

        <tr
          *ngFor="let hora of horarios"
        >

          <td class="horario">
            {{ hora }}
          </td>


          <td
            *ngFor="let dia of diasSemana"
            class="agenda-slot"
          >

            <ng-container
              *ngIf="
                getAgendamentoSlot(dia, hora) as item;
                else slotVazio
              "
            >

              <div class="agendamento">

                <div class="agendamento-sala">
                  {{ item.sala }}
                </div>

                <div class="agendamento-materia">
                  {{ item.materia }}
                </div>

              </div>

            </ng-container>


            <ng-template #slotVazio>

              <div class="slot-vazio"></div>

            </ng-template>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<!-- ========================================= -->
<!-- MODAL DE CONFIRMAÇÃO -->
<!-- ========================================= -->

<div
  *ngIf="mostrarConfirmacao"
  class="modal-overlay"
>

  <div class="modal">

    <h2 class="modal-title">
      Confirmar Agendamento
    </h2>


    <p class="modal-description">
      Confira os dados antes de confirmar.
    </p>


    <!-- SALA -->

    <div class="confirmacao-item">

      <strong>
        Sala
      </strong>

      <div class="confirmacao-valor">
        {{ form.sala }}
      </div>

    </div>


    <!-- DATA -->

    <div class="confirmacao-item">

      <strong>
        Data
      </strong>

      <div class="confirmacao-valor">
        {{ form.data }}
      </div>

    </div>


    <!-- DIA -->

    <div class="confirmacao-item">

      <strong>
        Dia
      </strong>

      <div class="confirmacao-valor">
        {{ diaConfirmacao }}
      </div>

    </div>


    <!-- HORÁRIO -->

    <div class="confirmacao-item confirmacao-horario">

      <strong>
        Horário
      </strong>

      <div class="confirmacao-valor">
        {{ form.hora }}
      </div>

    </div>


    <!-- BOTÕES -->

    <div class="modal-buttons">

      <!-- CANCELAR -->

      <button
        type="button"
        (click)="cancelarConfirmacao()"
        class="btn-cancelar"
      >
        Cancelar
      </button>


      <!-- CONFIRMAR -->

      <button
        type="button"
        (click)="confirmarAgendamento()"
        class="btn-confirmar"
      >
        Confirmar
      </button>

    </div>

  </div>

</div>
