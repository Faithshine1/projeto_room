<aside class="sidebar">
  <div class="brand">
    <h2>EduRoom's</h2>
  </div>

  <nav class="nav-menu">
    <button class="nav-item-simple">
      <span class="icon">🏠</span> Início
    </button>
    <button class="nav-item-simple">
      <span class="icon">🔍</span> Buscar Salas
    </button>

    <div class="menu-section">
      <span class="menu-label">Salas</span>
      
      <button 
        class="nav-item" 
        [class.active]="activeCategory === 'laboratorios'"
        (click)="selectCategory('laboratorios')">

      </button>

      <button 
        class="nav-item" 
        [class.active]="activeCategory === 'especiais'"
        (click)="selectCategory('especiais')">

      </button>
    </div>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item-simple">
      <span class="icon">⋯</span> Configurações
    </button>
  </div>
