
<!-- Botão para abrir e fechar o menu no celular -->
<button
  type="button"
  class="mobile-menu-toggle"
  (click)="toggleMobileMenu()"
  [attr.aria-expanded]="isMobileMenuOpen"
  aria-label="Abrir ou fechar menu"
>
  <i
    class="fa-solid"
    [ngClass]="isMobileMenuOpen ? 'fa-xmark' : 'fa-bars'"
  ></i>
</button>

<!-- Fundo escurecido do menu mobile -->
<div
  class="sidebar-backdrop"
  [class.visible]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
  aria-hidden="true"
></div>

<!-- Menu lateral -->
<aside class="sidebar" [class.mobile-open]="isMobileMenuOpen">

  <!-- Identidade do sistema -->
  <div class="brand">
    <span class="brand-mark">
      <i class="fa-solid fa-graduation-cap"></i>
    </span>

    <h2>EduRoom's</h2>

    <button
      type="button"
      class="mobile-close"
      (click)="closeMobileMenu()"
      aria-label="Fechar menu"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Navegação principal -->
  <nav class="nav-menu" aria-label="Menu principal">

    <!-- Painel -->
    <button
      type="button"
      class="nav-item"
      [class.active]="activeCategory === 'inicio'"
      (click)="selectCategory('inicio')"
    >
      <i class="fa-solid fa-table-cells-large"></i>
      <span>Painel</span>
    </button>

    <!-- Salas -->
    <div class="menu-section">
      <span class="menu-label">Salas</span>

      <button
        type="button"
        class="nav-item"
        [class.active]="activeCategory === 'laboratorios'"
        (click)="selectCategory('laboratorios')"
      >
        <i class="fa-solid fa-flask-vial"></i>
        <span>Laboratórios</span>
      </button>

      <button
        type="button"
        class="nav-item"
        [class.active]="activeCategory === 'especiais'"
        (click)="selectCategory('especiais')"
      >
        <i class="fa-solid fa-school"></i>
        <span>Salas Especiais</span>
      </button>
    </div>

    <!-- Agendamentos -->
    <button
      type="button"
      class="nav-item"
      [class.active]="activeCategory === 'agendamentos'"
      (click)="selectCategory('agendamentos')"
    >
      <i class="fa-solid fa-calendar-days"></i>
      <span>Agendamentos</span>
    </button>

    <!-- Minhas reservas -->
    <button
      type="button"
      class="nav-item"
      [class.active]="activeCategory === 'minhas-reservas'"
      (click)="selectCategory('minhas-reservas')"
    >
      <i class="fa-solid fa-list-check"></i>
      <span>Minhas Reservas</span>
    </button>

    <!-- Leitor QR Code -->
    <button
      type="button"
      class="nav-item"
      [class.active]="activeCategory === 'leitor-qr'"
      (click)="selectCategory('leitor-qr')"
    >
      <i class="fa-solid fa-qrcode"></i>
      <span>Leitor QR Code</span>
    </button>

  </nav>

  <!-- Rodapé -->
  <div class="sidebar-footer">
    <button type="button" class="nav-item">
      <i class="fa-solid fa-gear"></i>
      <span>Configurações</span>
    </button>
  </div>

</aside>
