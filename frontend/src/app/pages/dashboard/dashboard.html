<div class="layout-container">

  <!-- Sidebar -->
  <app-sidebar
    [activeCategory]="activeCategory"
    (categoryChange)="setCategory($event)">
  </app-sidebar>

  <main class="main-content">

    <!-- Cabeçalho -->
    <header class="top-header">

      <nav class="tabs-nav">

        <button
          [class.active]="activeCategory === 'especiais'"
          (click)="setCategory('especiais')">
          Salas Especiais
        </button>

        <button
          [class.active]="activeCategory === 'laboratorios'"
          (click)="setCategory('laboratorios')">
          Laboratórios
        </button>

        <button
          [class.active]="activeCategory === 'agendamentos'"
          (click)="setCategory('agendamentos')">
          Agendamentos
        </button>

      </nav>

      <div class="user-profile">

        <div class="avatar-group">

          <img
            src="https://ui-avatars.com/api/?name=User&background=random&rounded=true"
            alt="Avatar"
            class="avatar-img">

          <span class="chevron">⌄</span>

        </div>

        <button class="btn-logout" (click)="logout()">
          Logout
        </button>

      </div>

    </header>

    <!-- ========================= -->
    <!-- VISTA INÍCIO -->
    <!-- ========================= -->

    <section
      class="inicio-section"
      *ngIf="activeCategory === 'inicio'">

      <app-inicio [nomeUsuario]="nomeUsuario"></app-inicio>

    </section>


    <!-- ========================= -->
    <!-- VISTA SALAS -->
    <!-- ========================= -->

    <section
      class="table-section"
      *ngIf="
        activeCategory !== 'agendamentos' &&
        activeCategory !== 'inicio'
      ">

      <table class="rooms-table">

        <thead>

          <tr>

            <th class="col-xs">
              Nº
            </th>

            <th>
              {{
                activeCategory === 'especiais'
                  ? 'Salas Especiais'
                  : 'Laboratórios'
              }}
            </th>

            <th>
              Status
            </th>

            <th>
              Responsável
            </th>

            <th></th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let room of filteredRooms">

            <td class="col-muted">
              {{ room.number }}
            </td>

            <td class="col-main">
              {{ room.name }}
            </td>

            <td>

              <div class="status-indicator">

                <span
                  class="dot"
                  [ngClass]="getStatusClass(room.status)">
                </span>

                <span class="status-text">
                  {{ room.status }}
                </span>

              </div>

            </td>

            <td>

              <div
                class="responsible-cell"
                *ngIf="room.responsible">

                <span class="responsible-avatar"></span>

                <span class="col-muted">
                  {{ room.responsible }}
                </span>

              </div>

            </td>

            <td class="col-actions">

              <button
                class="btn-action-dots"
                (click)="openActionModal(room)">
                ⋯
              </button>

            </td>

          </tr>


          <tr *ngIf="filteredRooms.length === 0">

            <td
              colspan="5"
              style="text-align: center; padding: 2rem; color: #9ca3af;">

              Nenhuma sala encontrada.

            </td>

          </tr>

        </tbody>

      </table>

    </section>


    <!-- ========================= -->
    <!-- VISTA AGENDAMENTOS -->
    <!-- ========================= -->

    <section
      class="agenda-section"
      *ngIf="activeCategory === 'agendamentos'">

      <app-agenda-semanal></app-agenda-semanal>

    </section>

  </main>

</div>
